name: Bug report
description: Report unexpected CLI or fixture behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here. Use the private reporting process in SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, sanitized output, and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: "e.g. main at abc1234"
    validations:
      required: true
  - type: dropdown
    id: cloud
    attributes:
      label: Cloud provider
      options: [AWS, Azure, Not applicable]
    validations:
      required: true
